[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-twin-ingest"
version = "0.1.0"
description = "Ingest Google Docs into a Markdown-based digital twin knowledge base."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "google-api-python-client",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "pydantic>=2",
    "python-dotenv",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
